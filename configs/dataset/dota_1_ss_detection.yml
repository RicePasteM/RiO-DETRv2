task: detection

evaluator:
  type: DotaAutoEvaluator
  backend_url: http://dota-auto-eval.codesocean.top
  api_key: ""
  server_id: 1
  outfile_prefix: ./work_dirs/dota/Task1
  merge_patches: True
  iou_types: ['mAP']

num_classes: 15
remap_mscoco_category: False

train_dataloader: 
  type: DataLoader
  dataset:  
    type: DOTADataset
    img_folder: ./datasets/dota-1.0/single-scale/trainval/images
    ann_folder: ./datasets/dota-1.0/single-scale/trainval/annfiles
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True 
  collate_fn:
    type: BatchImageCollateFunction


val_dataloader:
  type: DataLoader
  dataset: 
    type: DOTADataset
    img_folder: ./datasets/dota-1.0/single-scale/test/images
    ann_folder: ./datasets/dota-1.0/single-scale/test/annfiles
    return_masks: False
    transforms:
      type: Compose
      ops: ~ 
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
