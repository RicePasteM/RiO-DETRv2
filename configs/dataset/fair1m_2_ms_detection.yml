task: detection

evaluator:
  type: DotaEvaluator
  iou_types: ['mAP']

num_classes: 37
remap_mscoco_category: False

train_dataloader: 
  type: DataLoader
  dataset: 
    type: FAIR1MDataset
    img_folder: ./datasets/fair1m-2.0/train/images
    ann_folder: ./datasets/fair1m-2.0/train/annfiles
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True 
  collate_fn:
    type: BatchImageCollateFunction


val_dataloader:
  type: DataLoader
  dataset: 
    type: FAIR1MDataset
    img_folder: ./datasets/fair1m-2.0/validation/images
    ann_folder: ./datasets/fair1m-2.0/validation/annfiles
    return_masks: False
    transforms:
      type: Compose
      ops: ~ 
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
