__include__: [
  '../dataset/dior_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/rtv2_optimizer.yml',
  '../base/rtv2_r50vd.yml',
]

output_dir: ./outputs/riov2_hgnetv2_s_diorr

RTv4:
  backbone: HGNetv2
  decoder: RTDETRTransformerv2OBBFDR

HGNetv2:
  name: 'B0'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True
  pretrained: True
  local_model_dir: ./pretrain/hgnetv2/

criterion: RTv4OBBCriterion
postprocessor: PostProcessorOBB

PostProcessorOBB:
  num_top_queries: 300
  input_shape: [800, 800]

teacher_model:
  type: "DINOv3TeacherModel"
  dinov3_repo_path: ./third_party/dinov3
  dinov3_weights_path: ./pretrain/dinov3/dinov3_vitb16_pretrain_lvd1689m.pth
  patch_size: 16
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

HybridEncoder:
  in_channels: [256, 512, 1024]
  version: rtdetr
  expansion: 0.5
  depth_mult: 0.34
  hidden_dim: 224
  distill_teacher_dim: 768

RTDETRTransformerv2OBBFDR:
  feat_channels: [224, 224, 224]
  feat_strides: [8, 16, 32]
  hidden_dim: 224
  num_levels: 3
  num_layers: 3
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  learn_query_content: True
  eval_idx: -1
  num_points: [4, 4, 4]
  cross_attn_method: default
  query_select_method: default
  query_pos_method: rio
  anchor_aspect_ratio: 1.0
  use_dfine_decoder_attention: False
  layer_scale: 1
  reg_max: 32
  reg_scale: 4.0
  angle_bins: 36
  angle_fdr_mode: coarse_to_fine
  angle_fdr_scale_factor: 1.5
  mixed_reg_head: False
  angle_aware_lqe: True

RTv4OBBCriterion:
  weight_dict: {loss_vfl: 1, loss_l1: 5, loss_kld: 5, loss_fgl: 0.15, loss_angle_fgl: 0.15, loss_ddf: 1.5, loss_distill: 20}
  losses: ['vfl', 'l1', 'kld', 'local', 'angle_local', 'distill']
  reg_max: 32
  alpha: 0.75
  gamma: 2.0
  use_uni_set: True
  matcher:
    type: HungarianMatcherOBB
    weight_dict: {cost_class: 2, cost_bbox: 0, cost_hausdorff: 5, cost_giou: 5}
    alpha: 0.25
    gamma: 2.0
  distill_adaptive_params:
    enabled: True
    rho: 2
    delta: 0.25
    default_weight: 20

epoches: 132
lrsheduler: flatcosine
warmup_iter: -1
flat_epoch: 64
no_aug_epoch: 12
lr_warmup_scheduler: ~

optimizer:
  type: AdamW
  params:
    - params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00001
      weight_decay: 0.
    - params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

train_dataloader:
  total_batch_size: 16
  dataset:
    transforms:
      ops:
        - {type: MosaicOBB, output_size: 800, rotation_range: 0, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5], probability: 1.0, fill_value: 0, use_cache: False, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: SanitizeBoundingBoxesOBB, min_size: 1}
        - {type: RandomZoomOutOBB, fill: 0}
        - {type: RandomIoUCropOBB, p: 0.8}
        - {type: RandomHorizontalFlipOBB}
        - {type: ResizeOBB, size: [800, 800]}
        - {type: SanitizeBoundingBoxesOBB, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertOBB, normalize: True}
      policy:
        epoch: [4, 64, 120]
        ops: ['MosaicOBB', 'RandomPhotometricDistort', 'RandomZoomOutOBB', 'RandomIoUCropOBB']
      mosaic_prob: 0.5
  collate_fn:
    base_size: 800
    base_size_repeat: ~
    mixup_prob: 0.5
    mixup_epochs: [4, 64]
    stop_epoch: 120
    ema_restart_decay: 0.9999

val_dataloader:
  total_batch_size: 64
  dataset:
    transforms:
      ops:
        - {type: ResizeOBB, size: [800, 800], keep_ratio: True, pad_to_size: True, fill: 0}
        - {type: SanitizeBoundingBoxesOBB, min_size: 1.0}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertOBB, normalize: True}

use_swanlab: false
swanlab_project: "RiO-v2-final"
swanlab_experiment: "riov2_hgnetv2_s_diorr"
