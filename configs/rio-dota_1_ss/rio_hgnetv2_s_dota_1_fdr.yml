__include__: [
  './rio_hgnetv2_s_dota_1.yml',
]

output_dir: ./outputs/rio_hgnetv2_s_dota_1_ss_fdr

RTv4:
  decoder: RTDETRTransformerv2OBBFDR

RTDETRTransformerv2OBBFDR:
  feat_channels: [224, 224, 224]
  feat_strides: [8, 16, 32]
  hidden_dim: 224
  num_levels: 3
  num_layers: 4
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  learn_query_content: True
  eval_idx: -1
  num_points: [4, 4, 4]
  cross_attn_method: default
  query_select_method: default
  query_pos_method: rio
  anchor_aspect_ratio: 1.0
  layer_scale: 1
  reg_max: 32
  reg_scale: 4.0
  angle_bins: 36

RTv4OBBCriterion:
  weight_dict: {loss_focal: 1, loss_l1: 5, loss_kld: 5, loss_fgl: 0.15, loss_angle_fgl: 0.15}
  losses: ['focal', 'l1', 'kld', 'local', 'angle_local']
  reg_max: 32
